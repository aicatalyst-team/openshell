# Gateway ServiceAccount referenced by the preinstalled cluster-scoped
# binding (ClusterRole autopoc-openshell-runtime -> SA openshell in
# poc-openshell). The chart sets serviceAccount.create=false and uses this
# preinstalled identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell
  namespace: poc-openshell
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/managed-by: autopoc
    autopoc/project: openshell
